services:

  postgres:

    image: postgis/postgis:17-3.5

    container_name: nrw-postgis

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:

    image: dpage/pgadmin4

    container_name: nrw-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

  sentinel1-soil-moisture:

    build:
      context: .
      dockerfile: Dockerfile

    profiles:
      - satellite

    volumes:
      - ./data/sentinel1_demo:/app/data/sentinel1_demo

    command:
      - sh
      - -c
      - >-
        python scripts/create_sentinel1_demo.py --output-dir /app/data/sentinel1_demo
        && python -m app.satellite.soil_moisture
        --config /app/data/sentinel1_demo/config.json
        --output /app/data/sentinel1_demo/result.geojson

volumes:

  postgres_data: